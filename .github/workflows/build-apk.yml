name: Build TV & Mobile APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [leanback, mobile]
        abi: [arm64_v8a, armeabi_v7a]

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true  # 如果有 submodule，保留

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Set up Python 3.10 for Chaquopy
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 4️⃣ Setup Android SDK / Build Tools / NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk: 25.2.9519653

      # 5️⃣ Accept SDK licenses
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      # 6️⃣ Grant gradlew permission
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 7️⃣ Build APK (Debug)
      - name: Build Debug APK
        run: |
          echo "Flavor: ${{ matrix.flavor }}, ABI: ${{ matrix.abi }}"

          if [ "${{ matrix.flavor }}" = "leanback" ] && [ "${{ matrix.abi }}" = "arm64_v8a" ]; then
            TASK=assembleLeanbackArm64v8aDebug
          elif [ "${{ matrix.flavor }}" = "leanback" ] && [ "${{ matrix.abi }}" = "armeabi_v7a" ]; then
            TASK=assembleLeanbackArmeabiV7aDebug
          elif [ "${{ matrix.flavor }}" = "mobile" ] && [ "${{ matrix.abi }}" = "arm64_v8a" ]; then
            TASK=assembleMobileArm64v8aDebug
          elif [ "${{ matrix.flavor }}" = "mobile" ] && [ "${{ matrix.abi }}" = "armeabi_v7a" ]; then
            TASK=assembleMobileArmeabiV7aDebug
          else
            echo "Unknown flavor/ABI combination"
            exit 1
          fi

          echo "Running Gradle task: $TASK"
          ./gradlew $TASK --stacktrace

      # 8️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}-${{ matrix.abi }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.abi }}/debug/*.apk
