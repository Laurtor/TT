name: Build Mobile APK (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2️⃣ Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Setup Python 3.10 (Chaquopy)
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # 4️⃣ Setup Android SDK / Build Tools / NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "9.0.0"
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;25.2.9519653
          accept-android-sdk-licenses: true

      # 5️⃣ Grant gradlew permission
      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 6️⃣ Build APK (Debug) - Mobile arm64_v8a
      - name: Build Mobile Arm64 Debug APK
        run: |
          TASK=assembleMobileArm64v8aDebug
          echo "Running Gradle task: $TASK"
          ./gradlew $TASK --stacktrace

      # 7️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64_v8a-debug.apk
          path: app/build/outputs/apk/mobile/arm64_v8a/debug/*.apk
