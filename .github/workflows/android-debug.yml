name: Build Mobile APK (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: |
            platforms;android-33
            build-tools;33.0.2
            ndk;25.2.9519653
          accept-android-sdk-licenses: true

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build APK (Debug) - Mobile arm64_v8a
        run: |
          TASK=assembleMobileArm64v8aDebug
          echo "Running Gradle task: $TASK"
          ./gradlew $TASK --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-arm64_v8a-debug.apk
          path: app/build/outputs/apk/mobile/arm64_v8a/debug/*.apk
