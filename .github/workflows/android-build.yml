name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [leanback, mobile]
        abi: [arm64_v8a, armeabi_v7a]

    steps:
      # 1️⃣ 取得 repo
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true  # 如果你有 catvod/chaquo/quickjs submodules，開啟

      # 2️⃣ 安裝 Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ 安裝 Python 3.10（Chaquopy）
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 4️⃣ 安裝 Android SDK / NDK / Build Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk: 25.2.9519653

      # 5️⃣ Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6️⃣ Build APK
      - name: Build Debug APK
        run: ./gradlew assemble${{ matrix.flavor | capitalize }}${{ matrix.abi | replace('_', '') }}Debug --stacktrace

      # 7️⃣ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.flavor }}-${{ matrix.abi }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.abi }}/debug/*.apk
