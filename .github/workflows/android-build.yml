name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flavor: [leanback, mobile]
        abi: [arm64_v8a, armeabi_v7a]

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true  # 如果有 submodule

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Setup Python 3.10 for Chaquopy
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      # 4️⃣ Setup Android SDK / Build Tools / NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 36
          build-tools: 36.0.0
          ndk: 25.2.9519653

      # 5️⃣ Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 6️⃣ Build APK (Debug)
      - name: Build Debug APK
        run: |
          echo "Flavor: ${{ matrix.flavor }}, ABI: ${{ matrix.abi }}"

          if [ "${{ matrix.flavor }}" = "leanback" ] && [ "${{ matrix.abi }}" = "arm64_v8a" ]; then
            TASK=assembleLeanbackArm64v8aDebug
          elif [ "${{ matrix.flavor }}" = "leanback" ] && [ "${{ matrix.abi }}" = "armeabi_v7a" ]; then
            TASK=assembleLeanbackArmeabiV7aDebug
          elif [ "${{ matrix.flavor }}" = "mobile" ] && [ "${{ matrix.abi }}" = "arm64_v8a" ]; then
            TASK=assembleMobileArm64v8aDebug
          elif [ "${{ matrix.flavor }}" = "mobile" ] && [ "${{ matrix.abi }}" = "armeabi_v7a" ]; then
            TASK=assembleMobileArmeabiV7aDebug
          else
            echo "Unknown flavor/ABI combination"
            exit 1
          fi

          echo "Running Gradle task: $TASK"
          ./gradlew $TASK --stacktrace

      # 7️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.flavor }}-${{ matrix.abi }}-debug.apk
          path: app/build/outputs/apk/${{ matrix.flavor }}/${{ matrix.abi }}/debug/*.apk
