plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fongmi.android.tv'

    compileSdk 36

    defaultConfig {
        applicationId "com.fongmi.android.tv"
        minSdk 24
        targetSdk 36
        versionCode 513
        versionName "5.1.3"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
                        "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"
                ]
            }
        }
    }

    flavorDimensions "mode", "abi"

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/beans.xml', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "${variant.productFlavors[0].name}-${variant.productFlavors[1].name}.apk"
        }
    }

    configurations.all {
        resolutionStrategy {
            // 強制 OkHttp 版本，避免 CI 取到不同版本
            force 'com.squareup.okhttp3:okhttp:4.11.0'
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    // 對 GitHub Actions 友好: 避免本地 Module，如果需要，確保 submodule clone
    // implementation project(':catvod')
    // implementation project(':chaquo')
    // implementation project(':quickjs')

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.media3:media3-common:1.2.0'
    implementation 'androidx.media3:media3-container:1.2.0'
    implementation 'androidx.media3:media3-database:1.2.0'
    implementation 'androidx.media3:media3-datasource:1.2.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.0'
    implementation 'androidx.media3:media3-datasource-rtmp:1.2.0'
    implementation 'androidx.media3:media3-decoder:1.2.0'
    implementation 'androidx.media3:media3-effect:1.2.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.2.0'
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.2.0'
    implementation 'androidx.media3:media3-extractor:1.2.0'
    implementation 'androidx.media3:media3-ui:1.2.0'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'com.google.android.material:material:1.13.0'

    // 第三方
    implementation 'com.airbnb.android:lottie:6.7.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:annotations:4.16.0'
    implementation 'com.github.bumptech.glide:avif-integration:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.30'

    // Annotation Processors
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.3.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
